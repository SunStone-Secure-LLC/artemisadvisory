name: Publish FedRAMP Advisor Information

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/**
      - scripts/build_fedramp_advisor_information.py
      - .github/workflows/publish-fedramp-advisor-information.yml
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  ADVISOR_JSON: dist/fedramp-advisor-information.json
  LOGO_FILE: assets/sunstone-logo.svg
  PUBLIC_ASSET_URL: https://github.com/${{ github.repository }}/releases/download/fedramp-advisor-information/fedramp-advisor-information.json
  RELEASE_TAG: fedramp-advisor-information
  RELEASE_TITLE: FedRAMP Advisor Information
  SCHEMA_URL: https://www.fedramp.gov/schemas/fedramp-advisor-information-schema-2026-06-24.json

jobs:
  publish:
    name: Build, validate, and publish JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build advisor information JSON
        run: python scripts/build_fedramp_advisor_information.py --output "$ADVISOR_JSON"

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema referencing

      - name: Validate JSON against FedRAMP schema
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          from jsonschema import FormatChecker, validators
          from referencing import Registry, Resource

          schema_url = os.environ["SCHEMA_URL"]
          json_path = Path(os.environ["ADVISOR_JSON"])

          def fetch_json(url):
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          def retrieve(uri):
              # The advisor schema $refs the shared fedramp-common-definitions schema.
              if not uri.startswith("https://fedramp.gov/") and not uri.startswith(
                  "https://www.fedramp.gov/"
              ):
                  raise ValueError(f"Refusing to retrieve non-FedRAMP reference: {uri}")
              print(f"Retrieving referenced schema: {uri}")
              return Resource.from_contents(fetch_json(uri))

          schema = fetch_json(schema_url)

          data = json.loads(json_path.read_text(encoding="utf-8"))
          Validator = validators.validator_for(schema)
          Validator.check_schema(schema)
          validator = Validator(
              schema,
              registry=Registry(retrieve=retrieve),
              format_checker=FormatChecker(),
          )
          errors = sorted(validator.iter_errors(data), key=lambda error: error.json_path)

          if errors:
              for error in errors:
                  print(f"{error.json_path}: {error.message}", file=sys.stderr)
              raise SystemExit(1)

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ADVISOR_JSON }}

      - name: Publish public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes="Public FedRAMP Advisor Information JSON validated against ${SCHEMA_URL}."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$notes"
            gh release upload "$RELEASE_TAG" "$ADVISOR_JSON" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$ADVISOR_JSON" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$notes"
          fi

      - name: Add public download URL to job summary
        run: |
          {
            echo "FedRAMP Advisor Information JSON published:"
            echo "$PUBLIC_ASSET_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy released JSON to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pages: write

    concurrency:
      group: github-pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ format('{0}fedramp-advisor-information.json', steps.deployment.outputs.page_url) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release asset into site directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p _site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "fedramp-advisor-information.json" \
            --dir _site

      - name: Add advisor logo to site directory
        run: cp "$LOGO_FILE" _site/

      - name: Validate downloaded JSON and logo reference
        run: |
          set -euo pipefail

          jq empty _site/fedramp-advisor-information.json

          logo_url="$(jq -er .logo _site/fedramp-advisor-information.json)"
          logo_name="${logo_url##*/}"
          if [ ! -f "_site/$logo_name" ]; then
            echo "Logo referenced by JSON ($logo_url) is not present in _site/" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add GitHub Pages URL to job summary
        env:
          PAGES_ASSET_URL: ${{ format('{0}fedramp-advisor-information.json', steps.deployment.outputs.page_url) }}
        run: |
          {
            echo "FedRAMP Advisor Information JSON deployed to GitHub Pages:"
            echo "$PAGES_ASSET_URL"
          } >> "$GITHUB_STEP_SUMMARY"
